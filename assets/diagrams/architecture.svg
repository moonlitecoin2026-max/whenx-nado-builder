<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc"><title id="title">Integration architecture and activation boundaries</title><desc id="desc">Public NADO data powers the live read-only terminal. Future user-approved orders would require registered attribution and verified execution. Private validation is implemented, while production XP and progression activation remain gated.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="m0 0 8 4-8 4" fill="none" stroke="#7891a6"/></marker></defs><rect width="1200" height="620" rx="18" fill="#0d1320"/><g font-family="Arial, sans-serif"><text x="40" y="45" fill="#9aead9" font-size="11" letter-spacing="2">CONCEPTUAL INTEGRATION · STAGE STATUS IS EXPLICIT</text><text x="40" y="85" fill="#eff4ff" font-size="27" font-weight="700">NADO activity → WHENX identity</text><g fill="#142b2b" stroke="#416b66"><rect x="40" y="125" width="250" height="105" rx="12"/><rect x="350" y="125" width="250" height="105" rx="12"/></g><g fill="#a7ead6" font-size="10"><text x="60" y="150">LIVE · PUBLIC READS</text><text x="370" y="150">LIVE · READ-ONLY</text></g><g fill="#f1f5fc" font-size="18"><text x="60" y="181">NADO SDK / public API</text><text x="370" y="181">WHENX terminal</text></g><g fill="#99b4be" font-size="12"><text x="60" y="207">Markets, quotes, candles, depth</text><text x="370" y="207">Market discovery, no execution</text></g><path d="M292 178h48" fill="none" stroke="#7891a6" marker-end="url(#arrow)"/><rect x="660" y="125" width="500" height="105" rx="12" fill="#222039" stroke="#60547e"/><text x="680" y="150" fill="#cbbae7" font-size="10">PLANNED / GATED · REGISTERED ATTRIBUTION REQUIRED</text><text x="680" y="181" fill="#f1f5fc" font-size="18">User wallet → approved NADO order → actual fill</text><text x="680" y="207" fill="#ada6c5" font-size="12">Wallet consent, registered Builder ID and execution checks</text><path d="M603 178h47" fill="none" stroke="#7891a6" stroke-dasharray="5 5" marker-end="url(#arrow)"/><path d="M910 232v36H165v31" fill="none" stroke="#7891a6" stroke-dasharray="5 5" marker-end="url(#arrow)"/><g fill="#172333" stroke="#415871"><rect x="40" y="310" width="250" height="110" rx="12"/><rect x="350" y="310" width="250" height="110" rx="12"/></g><g fill="#a8c4df" font-size="10"><text x="60" y="336">IMPLEMENTED · PRIVATE VALIDATION</text><text x="370" y="336">IMPLEMENTED · PRIVATE VALIDATION</text></g><g fill="#f1f5fc" font-size="18"><text x="60" y="368">Activity evidence</text><text x="370" y="368">Canonical execution identity</text></g><g fill="#a4b2c5" font-size="12"><text x="60" y="395">Execution, ownership, source checks</text><text x="370" y="395">Provenance retained; duplicates merged</text></g><path d="M292 365h48" fill="none" stroke="#7891a6" marker-end="url(#arrow)"/><g fill="#222039" stroke="#60547e"><rect x="660" y="310" width="220" height="110" rx="12"/><rect x="940" y="310" width="220" height="110" rx="12"/></g><g fill="#cbbae7" font-size="10"><text x="680" y="336">GATED · PRODUCTION OFF</text><text x="960" y="336">GATED · HIGHER XP POLICIES</text></g><g fill="#f1f5fc" font-size="18"><text x="680" y="368">Eligible wallet XP</text><text x="960" y="368">Forecaster progression</text></g><g fill="#ada6c5" font-size="12"><text x="680" y="395">Approval and eligibility required</text><text x="960" y="395">Identity, L1–L5, Protocol Power</text></g><path d="M603 365h47M883 365h47" fill="none" stroke="#7891a6" stroke-dasharray="5 5" marker-end="url(#arrow)"/><path d="M40 462h1120" stroke="#2e394c"/><text x="40" y="500" fill="#e1e9f5" font-size="16">Different stages. Different proofs.</text><text x="40" y="532" fill="#99a9bf" font-size="14">A market observation is not a trade. A verified fill is not automatically eligible XP.</text><text x="40" y="563" fill="#7f91ab" font-size="12">This diagram omits operational infrastructure and does not imply that all stages are active.</text></g></svg>
