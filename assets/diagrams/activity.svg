<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 350" role="img" aria-labelledby="title desc"><title id="title">One underlying execution, at most one eligible XP award</title><desc id="desc">Conceptual provenance diagram. NADO and an Otomate route can observe the same execution. The economic identity is deduplicated before a separately gated eligibility decision. The demonstration issues zero XP.</desc><rect width="1200" height="350" rx="18" fill="#0d1320"/><g font-family="Arial, sans-serif"><text x="40" y="43" fill="#9aead9" font-size="11" letter-spacing="2">CONCEPTUAL PROVENANCE · SYNTHETIC EXAMPLE</text><text x="40" y="87" fill="#f0f4ff" font-size="28" font-weight="700">Two observations. One execution.</text><g fill="#172333" stroke="#415871"><rect x="40" y="124" width="230" height="60" rx="10"/><rect x="40" y="204" width="230" height="60" rx="10"/><rect x="430" y="151" width="320" height="88" rx="10"/></g><g fill="#e0e9f7" font-size="17"><text x="60" y="160">NADO observation</text><text x="60" y="240">Otomate provenance</text><text x="451" y="187">One canonical economic identity</text></g><text x="451" y="214" fill="#9faec2" font-size="12">Same execution reference · provenance retained</text><path d="M270 154h70v40h90M270 234h70v-40M750 194h80" fill="none" stroke="#7993a9" stroke-width="2"/><rect x="830" y="151" width="330" height="88" rx="10" fill="#222039" stroke="#60547e"/><text x="851" y="181" fill="#cbbbeb" font-size="10">SEPARATE APPROVAL GATE</text><text x="851" y="207" fill="#eff3fc" font-size="17">At most one eligible XP credit</text><text x="40" y="311" fill="#8e9fb8" font-size="13">A second data route does not create a second award. The public fixture issues zero XP.</text></g></svg>
